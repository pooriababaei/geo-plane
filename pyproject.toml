[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skyhear"
version = "0.1.0"
description = "Estimate recording location from aircraft Doppler signatures in audio."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Pooria" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "av>=11.0",
    "pyproj>=3.6",
    "geographiclib>=2.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numba>=0.63",
    "matplotlib>=3.8",
    "requests>=2.31",
    "httpx>=0.27",
    "click>=8.1",
    "timezonefinder>=9.0",
]

[project.scripts]
skyhear = "skyhear.cli:main"
geo-locate = "skyhear.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skyhear"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
